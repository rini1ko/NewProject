AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings app - weekly report. EventBridge Scheduler / SQS start the report-builder Lambda
  (in the VPC, reads Aurora, writes a CSV to S3). The S3 upload starts the report-mailer
  Lambda (outside the VPC), which sends the file through SES. Deployed after backend.yaml.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    AllowedPattern: "[a-z][a-z0-9-]*"
  ImageUri:
    Type: String
    Description: Backend image (output of the backend stack); the builder reuses it.
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: CommaDelimitedList
    Description: The backend's private subnets.
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: The backend function's security group (already allowed to reach Aurora).
  RouteTableId:
    Type: String
    Description: Route table of those subnets, for the S3 gateway endpoint.
  DatabaseEndpoint:
    Type: String
  DBName:
    Type: String
    Default: meetings
  DBUser:
    Type: String
    Default: meetings
  DBPassword:
    Type: String
    NoEcho: true
  ReportEmail:
    Type: String
    Description: Sender and recipient. In the SES sandbox both must be verified identities.
  ScheduleExpression:
    Type: String
    Default: cron(0 7 ? * MON *)
    Description: Use rate(5 minutes) to test, then set it back.
  ScheduleTarget:
    Type: String
    Default: direct
    AllowedValues: [direct, queue]
    Description: "direct = schedule invokes the builder (step 3); queue = schedule sends to SQS (step 4)."
  ScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]

Conditions:
  ViaQueue: !Equals [!Ref ScheduleTarget, queue]

Resources:
  # ------------------------------------------------------------------ Storage
  # The name is built (not !Ref'd) so the S3 -> mailer permission can name the bucket's ARN
  # without a circular dependency.
  ReportsBucket:
    Type: AWS::S3::Bucket
    DependsOn: MailerInvokePermission
    Properties:
      BucketName: !Sub ${ProjectName}-reports-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-reports
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 90
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt MailerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: reports/ }
                  - { Name: suffix, Value: .csv }
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Free. Without it the builder's PutObject hangs: the VPC has no internet route.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcId: !Ref VpcId
      RouteTableIds: [!Ref RouteTableId]

  # -------------------------------------------------------------------- Queue
  RequestsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-report-requests-dlq
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  RequestsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-report-requests
      # 6 x the builder's timeout (90 s): a message must not reappear while attempt 1 runs.
      VisibilityTimeout: 540
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RequestsDlq.Arn
        maxReceiveCount: 3
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ------------------------------------------------------------------ Builder
  BuilderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${ProjectName}/reports-builder
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: reports-builder
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !GetAtt RequestsQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-reports-builder
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      # Same image as the API; only the command differs (no migrations, no public routes).
      ImageConfig:
        Command: [uvicorn, app.reports.worker:app, --host, 0.0.0.0, --port, "8000"]
      Architectures: [arm64]
      MemorySize: 512
      # Aurora may need ~15 s to resume.
      Timeout: 90
      Role: !GetAtt BuilderRole.Arn
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: [!Ref SecurityGroupId]
      LoggingConfig:
        LogGroup: !Ref BuilderLogGroup
      Environment:
        Variables:
          DATABASE_URL: !Sub postgresql+asyncpg://${DBUser}:${DBPassword}@${DatabaseEndpoint}:5432/${DBName}
          DB_POOL_SIZE: "1"
          DB_MAX_OVERFLOW: "0"
          REPORTS_BUCKET: !Sub ${ProjectName}-reports-${AWS::AccountId}
          AWS_LWA_PORT: "8000"
          AWS_LWA_READINESS_CHECK_PATH: /health
          AWS_LWA_PASS_THROUGH_PATH: /events
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Lambda polls the queue for us, so the function itself never connects to SQS.
  BuilderQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt RequestsQueue.Arn
      FunctionName: !Ref BuilderFunction
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]

  # ----------------------------------------------------------------- Schedule
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: start-report
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt BuilderFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RequestsQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub ${ProjectName}-weekly-report
      State: !Ref ScheduleState
      ScheduleExpression: !Ref ScheduleExpression
      # Without this the cron runs in UTC and the report lands at 9 or 10 depending on DST.
      ScheduleExpressionTimezone: Europe/Kyiv
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !If [ViaQueue, !GetAtt RequestsQueue.Arn, !GetAtt BuilderFunction.Arn]
        RoleArn: !GetAtt SchedulerRole.Arn
        # No week: the builder takes the previous ISO week.
        Input: '{"week": null, "source": "schedule"}'

  # ------------------------------------------------------------------- Mailer
  MailerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${ProjectName}/reports-mailer
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: reports-mailer
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*
              - Effect: Allow
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Not in the VPC: it needs the internet (SES) and never touches the database.
  # It only reads reports/ and never writes there; writing would trigger itself forever.
  MailerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-reports-mailer
      Runtime: python3.13
      Handler: index.handler
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt MailerRole.Arn
      LoggingConfig:
        LogGroup: !Ref MailerLogGroup
      Environment:
        Variables:
          MAIL_FROM: !Ref ReportEmail
          MAIL_TO: !Ref ReportEmail
      Code:
        ZipFile: |
          import logging
          import os
          import urllib.parse
          from email.message import EmailMessage

          import boto3

          log = logging.getLogger()
          log.setLevel(logging.INFO)
          s3 = boto3.client("s3")
          ses = boto3.client("sesv2")


          def handler(event, context):
              record = event["Records"][0]
              bucket = record["s3"]["bucket"]["name"]
              key = urllib.parse.unquote_plus(record["s3"]["object"]["key"])
              log.info("report-mailer triggered trigger=s3 event=%s bucket=%s key=%s",
                       record["eventName"], bucket, key)

              body = s3.get_object(Bucket=bucket, Key=key)["Body"].read()
              name = key.rsplit("/", 1)[-1]
              week = name.removesuffix(".csv")

              msg = EmailMessage()
              msg["Subject"] = f"Weekly meetings report {week}"
              msg["From"] = os.environ["MAIL_FROM"]
              msg["To"] = os.environ["MAIL_TO"]
              msg.set_content(f"Hi,\n\nThe meetings report for {week} is attached.\n")
              msg.add_attachment(body, maintype="text", subtype="csv", filename=name)

              ses.send_email(Content={"Raw": {"Data": msg.as_bytes()}})
              log.info("report-mailer sent key=%s to=%s", key, os.environ["MAIL_TO"])
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MailerFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}

  # ---------------------------------------------------------------------- SES
  # No domain, so the address itself is the identity: AWS emails a confirmation link.
  SenderIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref ReportEmail
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

Outputs:
  BucketName:
    Value: !Sub ${ProjectName}-reports-${AWS::AccountId}
  QueueUrl:
    Value: !Ref RequestsQueue
  DlqUrl:
    Value: !Ref RequestsDlq
  BuilderLogGroup:
    Value: !Ref BuilderLogGroup
  MailerLogGroup:
    Value: !Ref MailerLogGroup